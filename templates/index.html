<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Impostor Game - Buat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #03c8ff 0%, #0858ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }

        @media (min-width: 480px) {
            .card {
                padding: 40px;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 5px;
            text-align: center;
        }

        @media (min-width: 480px) {
            h1 {
                font-size: 2.5em;
            }
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            touch-action: manipulation;
            min-height: 55px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            font-size: 14px;
            word-break: break-word;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #999;
            font-size: 14px;
        }

        .join-link {
            text-align: center;
            margin: 20px 0;
        }

        .join-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            padding: 10px;
            display: inline-block;
        }

        .info {
            margin-top: 25px;
            padding: 20px 15px;
            background: #f8f9fa;
            border-radius: 16px;
            color: #666;
        }

        .info h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .info ul {
            list-style-position: inside;
            margin-left: 5px;
        }

        .info li {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎮 Impostor Game</h1>
            <p class="subtitle">Buat room dan ajak temanmu!</p>
            
            {% if error %}
            <div class="error">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label for="name">👤 Nama Kamu</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Masukkan nama..." 
                        maxlength="20"
                        required 
                        autofocus
                    >
                </div>
                
                <button type="submit" class="btn">
                    🚀 Buat Room Baru
                </button>
            </form>

            <div class="divider">
                <span>atau</span>
            </div>

            <div class="join-link">
                <a href="{{ url_for('join') }}">🔗 Gabung ke Room</a>
            </div>

            <div class="info">
                <h3>📋 Cara Bermain:</h3>
                <ul>
                    <li>Minimal 2 pemain</li>
                    <li>Satu pemain jadi Penjahat</li>
                    <li>Warga tebak kata rahasia</li>
                    <li>Voting untuk eliminasi</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
